---
- name: Set up and Install Immich
  hosts: server
  become: true

  vars:
    compose_file_url: "https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml"
    env_template: "../../resources/immich/.env.j2"

    volumes:
      - "{{ external_dirs['pic']['path'] }}"

  tasks:
    - name: Create /srv/immich
      ansible.builtin.file:
        name: /srv/immich
        state: directory
        owner: immich
        group: immich
        mode: "750"

    - name: Create [docker_compose_dir]/immich
      ansible.builtin.file:
        name: "{{ docker_compose_dir }}/immich"
        state: directory
        owner: root
        group: stacks
        mode: "750"

    - name: Fetch the docker compose file
      ansible.builtin.get_url:
        url: "{{ compose_file_url }}"
        dest: "{{ docker_compose_dir }}/immich/docker-compose.yml"
        owner: root
        group: stacks
        mode: "700"

    - name: Add external volumes to immich server
      ansible.builtin.lineinfile:
        path: "{{ docker_compose_dir }}/immich/docker-compose.yml"
        insertafter: "^\\s{6}- /etc/localtime:/etc/localtime:ro$"
        line: "      - {{ item }}:{{ item }}:ro"
        state: present
      loop: "{{ volumes }}"

    - name: Add PICMEDIA group to immich server
      ansible.builtin.blockinfile:
        path: "{{ docker_compose_dir }}/immich/docker-compose.yml"
        insertafter: "^\\s*container_name:\\s*immich_server\\s*$"
        block: |2
              group_add:
                - "${PICMEDIA_GID}"
        state: present

    - name: Template in .env
      ansible.builtin.template:
        src: "{{ env_template }}"
        dest: "{{ docker_compose_dir }}/immich/.env"
        owner: root
        group: root
        mode: "700"

    - name: Start immich service
      community.docker.docker_compose_v2:
        project_name: immich
        project_src: "{{ docker_compose_dir }}/immich"
        state: present
        pull: always
      register: docker_output

    - name: Show results
      ansible.builtin.debug:
        var: docker_output

    - name: Shut immich down
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_dir }}/immich"
        state: stopped
      when: debug | bool
